
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire d'inscription</title>
</head>
<body>

    <h1>Formulaire d'inscription</h1>

    <form action="#" method="post">

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>
        <br><br>

        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>
        <br><br>

        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password"
               name="password" required>
        <br><br>

        <label for="date">Date de naissance :</label>
        <input type="date" id="date" name="date_naissance">
        <br><br>

        <p>Sexe :</p>
        <input type="radio" id="homme" name="sexe" value="H">
        <label for="homme">Homme</label>

        <input type="radio" id="femme" name="sexe" value="F">
        <label for="femme">Femme</label>
        <br><br>

        <label for="filiere">Filière :</label>
        <select id="filiere" name="filiere">
            <option value="">Choisir une filière</option>
            <option value="informatique">Informatique</option>
            <option value="data">Data Science</option>
            <option value="reseaux">Réseaux</option>
        </select>
        <br><br>

        <p>Centres d'intérêt :</p>
        <input type="checkbox" id="sport" name="interets" value="sport">
        <label for="sport">Sport</label>

        <input type="checkbox" id="lecture" name="interets" value="lecture">
        <label for="lecture">Lecture</label>

        <input type="checkbox" id="programmation" name="interets" value="programmation">
        <label for="programmation">Programmation</label>
        <br><br>

        <label for="photo">Photo :</label>
        <input type="file" id="photo" name="photo">
        <br><br>

        <input type="checkbox" id="conditions" required>
        <label for="conditions">J'accepte les conditions d'utilisation.</label>
        <br><br>

        <button type="submit">S'inscrire</button>
        <button type="reset">Réinitialiser</button>

    </form>

</body>
</html>
